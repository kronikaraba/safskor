<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Safskor · Canlı Taraftar Platformu</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Safskor ana sayfa">
      <img class="brand-logo" src="/img/logo.png" alt="Safskor" width="323" height="68" />
    </a>
    <div class="topbar-right">
      <a href="#/siralama" class="rank-link" aria-label="Haftalık tahmin sıralaması" title="Haftalık sıralama"><img class="fan-icon" src="/img/icons/oyuncu-kupasi.png" alt="" aria-hidden="true"><span>Sıralama</span></a>
      <span id="conn" class="conn" title="Bağlantı durumu"></span>
      <button id="nickBtn" class="nick-btn" type="button" aria-label="Takma adını değiştir"></button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="app" class="app"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="sheet" class="sheet-backdrop" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
