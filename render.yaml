# Render Blueprint (https://render.com/docs/blueprint-spec).
# Starter plan: her zaman açık; taraftar verileri (sohbet, puanlar, tahminler, sıralama) 1 GB kalıcı diskte saklanır (aylık ücretli).
# Ücretsiz denemek için: plan'ı free yapın, disk bölümünü ve DB_PATH satırını silin (veriler yeniden başlatmada sıfırlanır).
services:
  - type: web
    name: safskor
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_PROVIDER
        value: auto
      - key: API_FOOTBALL_KEY
        sync: false # değeri Render panelinde girin; boş kalırsa demo veriyle çalışır
      - key: API_FOOTBALL_LEAGUES
        value: 203,39,140,2
      - key: DB_PATH
        value: /data/safskor.db
      # Yoklama aralıkları kodda günde 100 isteklik ücretsiz plana göre ayarlı; ücretli planda düşürebilirsiniz.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
