# Render Blueprint: GitHub deposundan tek tıkla yayın (https://render.com/docs/blueprint-spec).
# Starter plan: her zaman açık; taraftar verileri (sohbet, puanlar, anketler) 1 GB kalıcı diskte saklanır.
# Ücretsiz denemek için: plan'ı free yapın, disk bölümünü ve DB_PATH satırını silin (veriler yeniden başlatmada sıfırlanır).
services:
  - type: web
    name: safskor
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_PROVIDER
        value: auto
      - key: API_FOOTBALL_KEY
        sync: false # değeri Render panelinde girin; boş kalırsa demo veriyle çalışır
      - key: API_FOOTBALL_LEAGUES
        value: 203,39,140,2
      - key: LIST_POLL_MS
        value: "900000"
      - key: DETAIL_POLL_MS
        value: "120000"
      - key: DB_PATH
        value: /var/data/safskor.db
    disk:
      name: safskor-data
      mountPath: /var/data
      sizeGB: 1
