# Render Blueprint (https://render.com/docs/blueprint-spec).
# Ücretsiz plan: 15 dk hareketsizlikte uyur; taraftar verileri (sohbet, puanlar, anketler) yeniden başlatmada sıfırlanır.
# Kalıcı veri için: plan'ı starter yapın, DB_PATH satırını ve disk bölümünü ekleyin (aylık ücretli):
#   - key: DB_PATH / value: /var/data/safskor.db
#   disk: { name: safskor-data, mountPath: /var/data, sizeGB: 1 }
services:
  - type: web
    name: safskor
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_PROVIDER
        value: auto
      - key: API_FOOTBALL_KEY
        sync: false # değeri Render panelinde girin; boş kalırsa demo veriyle çalışır
      - key: API_FOOTBALL_LEAGUES
        value: 203,39,140,2
      # Yoklama aralıkları kodda günde 100 isteklik ücretsiz plana göre ayarlı; ücretli planda düşürebilirsiniz.
